<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>منصة تصويت أكبر عطاي - TBZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800;900&display=swap">
<style>
:root{
  --bg:#fff4d6; --bg2:#e6ffd0; --card:#ffffff; --ink:#1a1a2e; --muted:#6b6b85;
  --orange:#ff6a3d; --lime:#c6f432; --violet:#6d4dff; --line:#1a1a2e;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14121f; --bg2:#1c2a14; --card:#211e33; --ink:#f4f2ff; --muted:#b4b0d0; --line:#f4f2ff;
  }
}
:root[data-theme="dark"]{
  --bg:#14121f; --bg2:#1c2a14; --card:#211e33; --ink:#f4f2ff; --muted:#b4b0d0; --line:#f4f2ff;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;overflow-x:hidden;
  font-family:"Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;
  color:var(--ink);background:var(--bg);
  background-image:radial-gradient(circle at 12% 6%,var(--bg2),transparent 55%),radial-gradient(circle at 92% 98%,var(--bg2),transparent 50%);
  display:grid;place-items:center;
}
.card{
  width:min(94vw,460px);margin:34px 0;background:var(--card);
  border:3px solid var(--line);border-radius:28px;box-shadow:8px 8px 0 var(--line);
  padding:32px 18px 22px;text-align:center;position:relative;
}
.badge{
  position:absolute;top:-22px;right:50%;transform:translateX(50%) rotate(-3deg);
  background:var(--lime);color:#1a1a2e;border:3px solid var(--line);
  border-radius:999px;padding:4px 20px;font-weight:900;font-size:1rem;white-space:nowrap;
}
h1{margin:14px 0 22px;font-size:clamp(1.5rem,6.4vw,2rem);line-height:1.45;font-weight:900}
h1 b{color:var(--orange)}
.btn{
  font:inherit;font-weight:900;font-size:1.35rem;cursor:pointer;
  border:3px solid var(--line);border-radius:18px;box-shadow:4px 4px 0 var(--line);
  color:#fff;background:var(--orange);padding:14px 44px;
  transition:transform .12s ease,box-shadow .12s ease;
}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
.btn:focus-visible,.chip:focus-visible,.link:focus-visible,.search:focus-visible{outline:4px solid var(--violet);outline-offset:3px}
.fade{animation:pop .3s ease}
.dots{display:flex;justify-content:center;gap:8px;margin-bottom:14px}
.dot{width:14px;height:14px;border-radius:50%;border:3px solid var(--line)}
.dot.done{background:var(--violet)}
.dot.now{background:var(--lime)}
.q{margin:0 0 14px;font-size:clamp(1.4rem,6vw,1.8rem);font-weight:900;line-height:1.4}
.search{
  width:100%;font:inherit;font-size:1.05rem;font-weight:500;color:var(--ink);background:var(--card);
  border:3px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:12px;
}
.names{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-height:46vh;overflow-y:auto;padding:4px 2px 10px}
.chip{
  font:inherit;font-weight:800;font-size:1rem;cursor:pointer;color:var(--ink);background:var(--bg);
  border:2.5px solid var(--line);border-radius:12px;box-shadow:3px 3px 0 var(--line);padding:8px 14px;
  transition:transform .1s ease,box-shadow .1s ease,background .1s ease;
}
.chip:active,.chip.hit{background:var(--lime);color:#1a1a2e;transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.empty{color:var(--muted);font-weight:500;padding:14px}
.link{margin-top:10px;font:inherit;font-weight:800;background:none;border:none;color:var(--muted);cursor:pointer;text-decoration:underline}
.calc{font-size:1.6rem;font-weight:900;margin:30px 0;animation:blink .9s ease infinite alternate}
.lab{font-size:1.3rem;font-weight:800;margin:0 0 6px;color:var(--muted)}
.name{
  font-size:clamp(2.4rem,13vw,3.6rem);font-weight:900;line-height:1.15;margin:6px 0 10px;word-break:break-word;
  color:var(--orange);text-shadow:3px 3px 0 var(--line);animation:pop .5s cubic-bezier(.2,1.3,.3,1) both;
}
.sign{
  display:inline-block;background:var(--lime);color:#1a1a2e;border:3px solid #1a1a2e;border-radius:20px;
  box-shadow:5px 5px 0 #1a1a2e;padding:12px 24px;font-size:clamp(1.4rem,6vw,1.8rem);font-weight:900;
  transform:rotate(-3deg);animation:drop .55s .35s cubic-bezier(.2,1.2,.3,1) both;
}
.cnt{margin:18px 0 0;font-weight:800;color:var(--muted)}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes drop{0%{transform:translateY(-60px) rotate(8deg);opacity:0}100%{transform:rotate(-3deg);opacity:1}}
@keyframes blink{from{opacity:.45}to{opacity:1}}
.bit{position:fixed;top:-40px;z-index:30;font-size:1.6rem;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion: reduce){
  .fade,.calc,.name,.sign{animation:none}
  .bit{display:none}
}
</style>
</head>
<body>
<main class="card">
  <div class="badge">TBZ 🔥</div>
  <div id="stage" aria-live="polite"></div>
</main>

<script>
(function(){
  /* قائمة الأسماء: عدّلها هنا (اسم بين علامتي اقتباس، وفاصلة بين كل اسم) */
  var NAMES=['2ilixirr','7','neeeeely.7','ACTA NON','alaa_ehaa','AMJED','Anwar aff','ay_vx1','Aya','B','Badreddin',
    'D.G','ennehl.1','Htez Ay','ishak','Islem','Jon','kvonx77','Laz2k666','Louai','LTS','MAYSA','mni3','Moh',
    'nwlyyyyy','N','sun','T.Mu','vqrx_ny','Walaa Alili','yysr_noui','zizou','مصعب','alic_bouz','mde_dhia',
    'marame__esl','jassmineee','vq_6h_','kira_madaf','ayatttt.33','ritadj_bou'];
  var Q=['أكثر شخص مزعج','أكثر شخص ينيك الراص','أكثر شخص نقش','أكثر شخص مترم','أكثر شخص معندوش حياة'];
  var st=document.getElementById('stage'),votes=[],i=0,timer=null;

  function dots(){
    return '<div class="dots">'+Q.map(function(_,k){return '<span class="dot'+(k<i?' done':(k===i?' now':''))+'"></span>'}).join('')+'</div>';
  }

  function home(){
    votes=[];i=0;clearTimeout(timer);
    st.innerHTML='<div class="fade"><h1>اهلا بك في منصة تصويت <b>اكبر عطاي</b> في مجموعة tbz</h1>'+
      '<button class="btn" id="go" type="button">بدأ</button></div>';
    document.getElementById('go').addEventListener('click',ask);
  }

  function ask(){
    st.innerHTML='<div class="fade">'+dots()+'<h2 class="q"></h2>'+
      '<input class="search" id="s" type="search" placeholder="ابحث عن اسم…" autocomplete="off">'+
      '<div class="names" id="names"></div>'+
      (i>0?'<button class="link" id="back" type="button">رجوع</button>':'')+'</div>';
    st.querySelector('.q').textContent=Q[i];
    var s=document.getElementById('s');
    s.addEventListener('input',function(){list(s.value)});
    var b=document.getElementById('back');
    if(b)b.addEventListener('click',function(){i--;votes.pop();ask()});
    list('');
  }

  function list(f){
    var box=document.getElementById('names'),k,c,shown=0;
    f=f.trim().toLowerCase();
    box.innerHTML='';
    NAMES.forEach(function(n){
      if(f&&n.toLowerCase().indexOf(f)<0)return;
      c=document.createElement('button');
      c.type='button';c.className='chip';c.textContent=n;
      c.addEventListener('click',function(){pick(n,c)});
      box.appendChild(c);shown++;
    });
    if(!shown){box.innerHTML='<div class="empty">ما كاين حتى اسم بهذا الشكل</div>'}
  }

  function pick(n,el){
    el.classList.add('hit');
    document.body.style.pointerEvents='none';
    setTimeout(function(){
      document.body.style.pointerEvents='';
      votes.push(n);i++;
      if(i<Q.length)ask();else calc();
    },260);
  }

  function calc(){
    st.innerHTML='<div class="fade"><p class="calc">جاري حساب الأصوات…</p></div>';
    timer=setTimeout(reveal,1800);
  }

  function reveal(){
    var cnt={},max=0,w=[];
    votes.forEach(function(n){cnt[n]=(cnt[n]||0)+1;if(cnt[n]>max)max=cnt[n]});
    Object.keys(cnt).forEach(function(n){if(cnt[n]===max)w.push(n)});
    var win=w[Math.floor(Math.random()*w.length)];
    st.innerHTML='<div><p class="lab">النتيجة</p><div class="name" id="win"></div>'+
      '<div class="sign">هاذا هو أكبر عطاي 🏆</div>'+
      '<p class="cnt">تم اختياره '+max+' من '+Q.length+'</p>'+
      '<button class="link" id="again" type="button">إعادة</button></div>';
    document.getElementById('win').textContent=win;
    document.getElementById('again').addEventListener('click',home);
    confetti();
  }

  function confetti(){
    var em=['🎉','🔥','😂','✨','🏆'],k,s;
    for(k=0;k<36;k++){
      s=document.createElement('span');
      s.className='bit';
      s.textContent=em[k%em.length];
      s.style.left=Math.random()*100+'vw';
      s.style.animationDuration=(2.2+Math.random()*2.2)+'s';
      s.style.animationDelay=(Math.random()*.8)+'s';
      document.body.appendChild(s);
      setTimeout(function(el){el.remove()}.bind(null,s),5600);
    }
  }

  home();
})();
</script>
</body>
</html>
